name: Check Data Freshness

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: wiki-data-freshness
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compare API baseline
        id: source
        run: python scripts/check-spire-codex-freshness.py --update

      - name: Regenerate wiki content
        if: steps.source.outputs.changed == 'true'
        run: python scripts/sync-spire-codex.py

      - name: Scan artwork bytes
        id: media
        run: python scripts/sync-r2-media.py --refresh --plan

      - name: Install Wrangler
        if: steps.media.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm install --global wrangler@4

      - name: Upload changed artwork to R2
        if: steps.media.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: python scripts/sync-r2-media.py

      - name: Build static site
        run: bash scripts/build-site.sh

      - name: Validate static output
        run: python scripts/check-built-content.py

      - name: Publish reports to job summary
        if: always()
        run: |
          test -f artifacts/spire-codex-diff.md && cat artifacts/spire-codex-diff.md >> "$GITHUB_STEP_SUMMARY" || true
          test -f artifacts/r2-media-diff.md && cat artifacts/r2-media-diff.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload diff reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshness-reports
          path: artifacts/*.md
          if-no-files-found: warn

      - name: Alert on added or removed entities
        if: steps.source.outputs.entity_set_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Data alert: Spire Codex entity set changed"
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file artifacts/spire-codex-diff.md
          else
            gh issue create --title "$title" --body-file artifacts/spire-codex-diff.md
          fi

      - name: Publish data update branch
        if: steps.source.outputs.changed == 'true' || (steps.media.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/spire-codex-${GITHUB_RUN_ID}"
          title="Data update: Spire Codex $(date -u +%F)"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
          {
            cat artifacts/spire-codex-diff.md
            printf '\n'
            cat artifacts/r2-media-diff.md
          } > /tmp/freshness-pr.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "$title"
          git push --set-upstream origin "$branch"
          if pr_url="$(gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/freshness-pr.md 2>/tmp/freshness-pr-error.txt)"; then
            {
              printf '## Data update pull request\n\n'
              printf '%s\n' "$pr_url"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/freshness-pr-error.txt >&2
            issue_title="Data update branch requires manual PR"
            {
              printf 'A Spire Codex data update branch was pushed, but GitHub Actions could not create the pull request automatically.\n\n'
              printf '- Branch: `%s`\n' "$branch"
              printf '- Compare URL: %s\n\n' "$compare_url"
              printf 'GitHub may require enabling **Allow GitHub Actions to create and approve pull requests** in repository Actions settings.\n\n'
              cat /tmp/freshness-pr.md
            } > /tmp/freshness-issue.md
            issue_number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)"
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --body-file /tmp/freshness-issue.md
            else
              gh issue create --title "$issue_title" --body-file /tmp/freshness-issue.md
            fi
            {
              printf '## Data update branch\n\n'
              printf 'Pushed `%s`, but automatic PR creation is disabled for GitHub Actions.\n\n' "$branch"
              printf 'Open manually: %s\n' "$compare_url"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert when R2 credentials are missing
        if: steps.media.outputs.changed == 'true' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "Changed artwork was detected, but Cloudflare credentials are unavailable." >&2
          exit 1
