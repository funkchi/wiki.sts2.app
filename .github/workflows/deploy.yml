name: Deploy Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wiki
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'wiki-sts2-app' }}
      CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build static site
        run: bash scripts/build-site.sh

      - name: Validate static output
        run: |
          test -f public/index.html
          test -f public/ads.txt
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/sitemap-pages.xml
          test -f public/docs/index.html
          test -f public/docs/javascripts/entity-browser.js
          test -f public/docs/javascripts/consent.js
          test -f public/docs/javascripts/wiki-analytics.js
          test -f public/images/hero.png
          test -f public/docs/search/search_index.json
          test -f 'functions/media/[[path]].js'
          test -f functions/api/analytics.js
          python scripts/check-built-content.py

      - name: Upload reproducible deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: wiki-pages-${{ github.sha }}
          path: |
            public
            functions
            wrangler.toml
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Report missing Cloudflare deploy credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Deploy alert: Cloudflare Pages credentials are unavailable"
          {
            printf 'The deploy workflow built and validated the static site, but skipped Cloudflare Pages deployment because credentials are unavailable.\n\n'
            printf 'Set repository secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` to enable automatic Pages deploys from GitHub Actions.\n\n'
            printf 'The workflow still uploads a reproducible `wiki-pages-%s` artifact on every successful run.\n' "${GITHUB_SHA}"
          } > /tmp/deploy-credentials-issue.md
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file /tmp/deploy-credentials-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/deploy-credentials-issue.md
          fi
          {
            printf '## Cloudflare deploy credentials missing\n\n'
            printf 'Built and validated the site, but automatic Pages deploy needs `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` repository secrets.\n'
          } >> "$GITHUB_STEP_SUMMARY"
