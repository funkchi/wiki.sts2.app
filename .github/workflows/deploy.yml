name: Deploy Wiki

on:
  push:
    branches: [astro]
  workflow_dispatch:

concurrency:
  group: deploy-wiki
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'wiki-sts2-app' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate build output
        run: |
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs/cards/index.html
          test -f dist/docs/cards/bash/index.html
          test -f dist/sitemap-index.xml
          test -f 'functions/media/[[path]].js'
          test -f functions/api/analytics.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wiki-pages-${{ github.sha }}
          path: |
            dist
            functions
            wrangler.toml
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Report missing Cloudflare deploy credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Deploy alert: Cloudflare Pages credentials are unavailable"
          {
            printf 'The deploy workflow built the Astro site, but skipped Cloudflare Pages deployment because credentials are unavailable.\n\n'
            printf 'Set repository secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` to enable automatic Pages deploys from GitHub Actions.\n'
          } > /tmp/deploy-credentials-issue.md
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file /tmp/deploy-credentials-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/deploy-credentials-issue.md
          fi
