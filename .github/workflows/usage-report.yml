name: Report Wiki Usage

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build 30-day usage report
        run: python scripts/report-analytics.py --allow-missing-credentials >> "$GITHUB_STEP_SUMMARY"

      - name: Report missing analytics credentials
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_ANALYTICS_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Analytics alert: Cloudflare usage reporting credentials are unavailable"
          {
            printf 'The weekly usage workflow ran, but it could not query Cloudflare Analytics Engine because credentials are unavailable.\n\n'
            printf 'Set repository secrets `CLOUDFLARE_ACCOUNT_ID` and `CLOUDFLARE_ANALYTICS_TOKEN` to enable usage reports.\n\n'
            cat artifacts/analytics/usage-report.md
          } > /tmp/analytics-credentials-issue.md
          issue_number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file /tmp/analytics-credentials-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/analytics-credentials-issue.md
          fi

      - name: Upload usage report
        uses: actions/upload-artifact@v7
        with:
          name: wiki-usage-report-${{ github.run_id }}
          path: artifacts/analytics
          if-no-files-found: error
          retention-days: 90
