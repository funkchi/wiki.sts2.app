site_name: Slay the Spire 2 Wiki
site_url: https://wiki.sts2.app/docs/
site_description: Community wiki for Slay the Spire 2 cards, relics, characters, enemies, and guides.
not_in_nav: |
  /cards/*.md
  /characters/*.md
  /enemies/*.md
  /relics/*.md
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  custom_dir: docs/overrides

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/entity-browser.js

nav:
  - Home: index.md
  - Characters: characters.md
  - Cards: cards.md
  - Relics: relics.md
  - Enemies: enemies.md
  - Guides: guides.md
  - About: about.md
  - Policies:
      - Privacy: privacy.md
      - Contact: contact.md
      - Disclaimer: disclaimer.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
